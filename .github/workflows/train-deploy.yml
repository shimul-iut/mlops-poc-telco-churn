name: CT/CD - Train & Deploy

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  train-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: CT - Retrain Model
        run: |
          python src/prepare_data.py
          python src/train.py

      - name: Validate Model & Data
        run: |
          python src/validate.py

      - name: CT - Push retrained model & data to DVC S3
        run: |
          dvc push

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: telco-churn-predictor
          IMAGE_TAG: latest
        run: |
          docker build --provenance=false --sbom=false -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: CD - Deploy to AWS Lambda
        env:
          LAMBDA_FUNCTION_NAME: telco-churn-predictor
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: telco-churn-predictor
        run: |
          aws lambda update-function-code \
            --function-name $LAMBDA_FUNCTION_NAME \
            --image-uri $ECR_REGISTRY/$ECR_REPOSITORY:latest
            
      - name: Wait for Lambda update to complete
        env:
          LAMBDA_FUNCTION_NAME: telco-churn-predictor
        run: |
          aws lambda wait function-updated --function-name $LAMBDA_FUNCTION_NAME

      - name: Run Smoke Test against Function URL
        env:
          LAMBDA_FUNCTION_NAME: telco-churn-predictor
        run: |
          FUNCTION_URL=$(aws lambda get-function-url-config --function-name $LAMBDA_FUNCTION_NAME --query "FunctionUrl" --output text)
          echo "Function URL is: $FUNCTION_URL"
          
          # We can run a small python smoke test that calls the Lambda Function URL
          # Note: Function URL is protected with AWS_IAM auth in the spec.
          # To perform SigV4 authentication in bash or python:
          python -c "
          import boto3
          import requests
          from botocore.auth import SigV4Auth
          from botocore.awsrequest import AWSRequest
          import sys
          
          url = '$FUNCTION_URL'
          payload = '{\"Contract\": 0, \"tenure\": 5, \"MonthlyCharges\": 70.35, \"TotalCharges\": 351.75, \"InternetService\": 1, \"PaymentMethod\": 2}'
          
          session = boto3.Session()
          credentials = session.get_credentials()
          region = session.region_name or '${{ secrets.AWS_REGION }}'
          
          request = AWSRequest(
              method='POST',
              url=url,
              data=payload,
              headers={'Content-Type': 'application/json'}
          )
          SigV4Auth(credentials, 'lambda', region).add_auth(request)
          
          print('Sending request to', url)
          resp = requests.post(url, data=payload, headers=dict(request.headers))
          print('Response status:', resp.status_code)
          print('Response body:', resp.text)
          
          if resp.status_code != 200:
              print('Error: Status code is not 200')
              sys.exit(1)
              
          data = resp.json()
          if 'prediction' not in data or 'probability' not in data:
              print('Error: Missing expected fields in response')
              sys.exit(1)
              
          print('Smoke test passed successfully!')
          "
